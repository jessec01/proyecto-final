<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login Yogui - YogaSystem</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'userYC/css/register.css' %}">
</head>

<body>
  <main class="container">
    <h1>Iniciar sesión</h1>
    <p class="hint">Accede con tu correo y contraseña de usuario.</p>

    <form id="loginForm" method="post" action="#">
      {% csrf_token %}
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" placeholder="usuario@ejemplo.com" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" minlength="8" maxlength="64" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
  <script src="{% static 'userYC/js/login.js' %}"></script>
</body>

</html>
