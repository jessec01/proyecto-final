<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Administrador de Centro</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'center_administration/css/register.css' %}">
</head>

<body>
    <main class="container">
        <h1>Iniciar sesión</h1>
        <p class="hint">Accede con tu correo y contraseña de administrador.</p>

        <form id="loginForm" method="post" action="#">
            {% csrf_token %}
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" placeholder="centro@ejemplo.com" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" minlength="8" maxlength="64" required>

            <button type="submit">Entrar</button>

            <div style="text-align: center; margin-top: 15px;">
                <a href="{% url 'main_home' %}"
                    style="display: block; padding: 10px; border-radius: 4px; border: 1px solid #7fb77e; color: #7fb77e; text-decoration: none; font-weight: bold; transition: background 0.3s; text-align: center;">Volver
                    al Dashboard</a>
            </div>
            <div style="text-align: center; margin-top: 10px;">
                <span style="font-size: 0.9em; color: #666;">¿No tienes cuenta? <a
                        href="{% url 'center_admin_register' %}"
                        style="color: #7fb77e; text-decoration: none; font-weight: bold;">Regístrate aquí</a></span>
            </div>
        </form>
    </main>
    <script src="{% static 'center_administration/js/login.js' %}"></script>
</body>

</html>
