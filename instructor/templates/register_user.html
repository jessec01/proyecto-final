<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Registro Instructor - YogaSystem</title>
	{% load static %}
	<link rel="stylesheet" href="{% static 'userYC/css/register.css' %}">
</head>
<body>
	<main class="container">
		<h1>Crear cuenta - Instructor</h1>
		<p class="hint">Rellena los datos para crear una cuenta de instructor.</p>

		<form id="registerForm" method="post" action="#">
			{% csrf_token %}
			<label for="email">Correo electrónico</label>
			<input id="email" name="email" type="email" placeholder="instructor@ejemplo.com" required>

			<label for="username">Nombre de usuario</label>
			<input id="username" name="username" type="text" placeholder="usuario_instructor" minlength="4" maxlength="16" required>

			<label for="first_name">Nombre</label>
			<input id="first_name" name="first_name" type="text" placeholder="Nombre" minlength="4" maxlength="16" required>

			<label for="last_name">Apellido</label>
			<input id="last_name" name="last_name" type="text" placeholder="Apellido" minlength="1" maxlength="30" required>

			<label for="phone">Teléfono (E.164)</label>
			<input id="phone" name="phone" type="tel" placeholder="+584121234567" required>

			<label for="password">Contraseña</label>
			<input id="password" name="password" type="password" minlength="8" maxlength="64" required>

			<label for="confirmation_password">Confirmar contraseña</label>
			<input id="confirmation_password" name="confirmation_password" type="password" minlength="8" maxlength="64" required>

			<button type="submit">Crear cuenta</button>
		</form>
	</main>
	<script src="{% static 'userYC/js/register.js' %}"></script>
</body>
</html>
